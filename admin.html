<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lua | Administración</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f3;color:#594b53;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px}header{text-align:center}header img{width:100px;border-radius:50%}h1,h2{font-family:Georgia,serif}section,article{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #594b5310}label{display:block;margin:12px 0 4px}input,select,textarea,button{font:inherit;border:1px solid #d8cbd0;border-radius:10px;padding:12px;width:100%}button{background:#806471;color:white;cursor:pointer;margin-top:10px}button.secondary{background:#eee4e8;color:#594b53}button:disabled{opacity:.5}textarea{min-height:80px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:100px}input[type=checkbox]{width:auto}#status{white-space:pre-wrap;overflow-wrap:anywhere}article img{width:100px;height:80px;object-fit:cover;border-radius:8px} [hidden]{display:none!important}</style></head><body><main><header><img src="logo.png" alt="Lua Nails & Lash"><h1>Panel de administración</h1><p>Lua Nails & Lash</p></header><p id="status" role="status" aria-live="polite"></p><section id="login"><h2>Iniciar sesión</h2><form id="loginForm"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button>Ingresar</button></form></section><div id="panel" hidden><button id="logout" class="secondary">Cerrar sesión</button><section><h2 id="formTitle">Nuevo servicio</h2><form id="serviceForm"><label for="categoria">Categoría</label><select id="categoria"><option>Uñas</option><option>Pestañas</option><option>Alizados</option><option>Trenzas</option><option>Peinados</option></select><label for="nombre">Nombre del servicio</label><input id="nombre" required maxlength="100"><label for="precio">Precio ($ ARS)</label><input id="precio" type="number" min="0" step="0.01" required><label for="duracion">Duración (minutos)</label><input id="duracion" type="number" min="1" step="1" required><label for="descripcion">Descripción</label><textarea id="descripcion" maxlength="1000"></textarea><label for="foto">Enlace HTTPS de la fotografía (opcional)</label><input id="foto" type="url"><label for="archivo">Seleccionar fotografía del celular o PC</label><input id="archivo" type="file" accept="image/jpeg,image/png,image/webp"><button type="button" id="upload" class="secondary">Subir fotografía</button><p id="uploadStatus" role="status"></p><img id="preview" hidden alt="Vista previa" style="max-width:100%;max-height:220px;border-radius:12px"><label><input id="activo" type="checkbox" checked> Servicio activo</label><button id="save">Guardar servicio</button><button type="button" id="cancel" class="secondary" hidden>Cancelar edición</button></form></section><h2>Servicios cargados</h2><div id="list"></div></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,push,set,update,remove,onValue} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const app=initializeApp({apiKey:'AIzaSyC4mgKf-7RDG9CFL6sc9RSuqG_7ZJysKUU',authDomain:'lua-nails-lash.firebaseapp.com',projectId:'lua-nails-lash',storageBucket:'lua-nails-lash.firebasestorage.app',messagingSenderId:'760291015064',appId:'1:760291015064:web:7f88e4bed9a57977fb93ed',databaseURL:'https://lua-nails-lash-default-rtdb.firebaseio.com'});const auth=getAuth(app),db=getDatabase(app),uid='NaeRy9DhLdRRZ0ynJQmYX5nd94I2';const $=id=>document.getElementById(id);let editing=null,unsubscribe=null;const msg=t=>$('status').textContent=t;const allowed=()=>auth.currentUser?.uid===uid;let uploading=false;function preview(){const url=$('foto').value.trim();$('preview').hidden=!url.startsWith('https://');if(!$('preview').hidden)$('preview').src=url;else $('preview').removeAttribute('src')}function reset(){editing=null;$('serviceForm').reset();$('formTitle').textContent='Nuevo servicio';$('cancel').hidden=true;$('uploadStatus').textContent='';preview()}function error(e){msg('No se pudo completar la operación: '+(e.code||e.message))} $('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch(e){error(e)}};$('logout').onclick=()=>signOut(auth).catch(error);$('cancel').onclick=reset;
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}const ok=user?.uid===uid;$('login').hidden=ok;$('panel').hidden=!ok;$('list').replaceChildren();reset();if(user&&!ok){msg('Usuario no autorizado.');signOut(auth).catch(error);return}if(ok){msg('Sesión iniciada.');unsubscribe=onValue(ref(db,'servicios'),snap=>render(snap.val()||{}),error)}});
$('foto').oninput=preview;
$('upload').onclick=async()=>{if(!allowed()||uploading)return;const f=$('archivo').files[0];const status=$('uploadStatus');if(!f)return status.textContent='Seleccioná una fotografía.';if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024)return status.textContent='Usá JPG, PNG o WEBP de hasta 5 MB.';const fd=new FormData();fd.append('file',f);fd.append('upload_preset','lua_nails_fotos');uploading=true;const controls=[...$('serviceForm').elements,...[$('logout')]];const states=controls.map(c=>c.disabled);controls.forEach(c=>c.disabled=true);$('list').inert=true;status.textContent='Subiendo fotografía…';try{const r=await fetch('https://api.cloudinary.com/v1_1/qqmjx1vh/image/upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok||!j.secure_url)throw new Error(j.error?.message||'Error de carga');if(!allowed())return;$('foto').value=j.secure_url;preview();status.textContent='Fotografía subida. Presioná Guardar servicio.';$('archivo').value=''}catch(e){status.textContent='No se pudo subir: '+e.message}finally{uploading=false;controls.forEach((c,i)=>c.disabled=states[i]);$('list').inert=false}};
$('serviceForm').onsubmit=async e=>{e.preventDefault();if(!allowed()||uploading)return;const foto=$('foto').value.trim();if(foto&&!foto.startsWith('https://')){msg('La fotografía debe usar un enlace HTTPS.');return}const data={categoria:$('categoria').value,nombre:$('nombre').value.trim(),precio:Number($('precio').value),duracion:Number($('duracion').value),descripcion:$('descripcion').value.trim(),foto,activo:$('activo').checked};if(!data.nombre)return msg('Ingresá un nombre.');$('save').disabled=true;try{if(editing)await update(ref(db,'servicios/'+editing),data);else await set(push(ref(db,'servicios')),data);reset();msg('Servicio guardado correctamente.')}catch(e){error(e)}finally{$('save').disabled=false}};
function render(data){const list=$('list');list.replaceChildren();if(!Object.keys(data).length){list.textContent='Todavía no hay servicios cargados.';return}for(const [id,s] of Object.entries(data)){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=s.nombre;a.append(h);if(typeof s.foto==='string'&&s.foto.startsWith('https://')){const img=document.createElement('img');img.src=s.foto;img.alt=s.nombre;img.referrerPolicy='no-referrer';a.append(img)}const p=document.createElement('p');p.textContent=`${s.categoria} · ${Number(s.precio).toLocaleString('es-AR',{style:'currency',currency:'ARS'})} · ${s.duracion} min · ${s.activo?'Activo':'Inactivo'}`;a.append(p);const desc=document.createElement('p');desc.textContent=s.descripcion||'';a.append(desc);const actions=document.createElement('div');actions.className='actions';function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.className='secondary';b.onclick=fn;actions.append(b)}btn('Editar',()=>{editing=id;for(const k of ['categoria','nombre','precio','duracion','descripcion','foto'])$(k).value=s[k]??'';$('activo').checked=!!s.activo;$('archivo').value='';$('uploadStatus').textContent='';preview();$('formTitle').textContent='Editar servicio';$('cancel').hidden=false;$('serviceForm').scrollIntoView({behavior:'smooth'})});btn(s.activo?'Desactivar':'Activar',async()=>{if(!allowed())return;try{await update(ref(db,'servicios/'+id),{activo:!s.activo})}catch(e){error(e)}});btn('Eliminar',async()=>{if(!allowed()||!confirm('¿Eliminar este servicio?'))return;try{await remove(ref(db,'servicios/'+id));if(editing===id)reset();msg('Servicio eliminado.')}catch(e){error(e)}});a.append(actions);list.append(a)}}
</script></body></html>
