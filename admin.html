<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lua | Administración</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f3;color:#594b53;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:20px}header{text-align:center}header img{width:100px;border-radius:50%}h1,h2{font-family:Georgia,serif}section,article{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #594b5310}label{display:block;margin:12px 0 4px}input,select,textarea,button{font:inherit;border:1px solid #d8cbd0;border-radius:10px;padding:12px;width:100%}button{background:#806471;color:white;cursor:pointer;margin-top:10px}button.secondary{background:#eee4e8;color:#594b53}button:disabled{opacity:.5}textarea{min-height:80px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:100px}input[type=checkbox]{width:auto}#status{white-space:pre-wrap;overflow-wrap:anywhere}article img{width:100px;height:80px;object-fit:cover;border-radius:8px} [hidden]{display:none!important}</style></head><body><main><header><img src="logo.png" alt="Lua Nails & Lash"><h1>Panel de administración</h1><p>Lua Nails & Lash</p></header><p id="status" role="status" aria-live="polite"></p><section id="login"><h2>Iniciar sesión</h2><form id="loginForm"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button>Ingresar</button></form></section><div id="panel" hidden><button id="logout" class="secondary">Cerrar sesión</button><section><h2 id="formTitle">Nuevo servicio</h2><form id="serviceForm"><label for="categoria">Categoría</label><select id="categoria"><option>Uñas</option><option>Pestañas</option><option>Alizados</option><option>Trenzas</option><option>Peinados</option></select><label for="nombre">Nombre del servicio</label><input id="nombre" required maxlength="100"><label for="precio">Precio ($ ARS)</label><input id="precio" type="number" min="0" step="0.01" required><label for="duracion">Duración (minutos)</label><input id="duracion" type="number" min="1" step="1" required><label for="descripcion">Descripción</label><textarea id="descripcion" maxlength="1000"></textarea><label for="foto">Enlace HTTPS de la fotografía (opcional)</label><input id="foto" type="url"><label for="archivo">Seleccionar fotografía del celular o PC</label><input id="archivo" type="file" accept="image/jpeg,image/png,image/webp"><button type="button" id="upload" class="secondary">Subir fotografía</button><p id="uploadStatus" role="status"></p><img id="preview" hidden alt="Vista previa" style="max-width:100%;max-height:220px;border-radius:12px"><label>Tipo de seña</label><select id="tipoSena"><option value="ninguna">Sin seña</option><option value="fija">Importe fijo ($)</option><option value="porcentaje">Porcentaje (%)</option></select><label>Valor de seña</label><input id="valorSena" type="number" min="0" step="0.01" value="0" required><label><input id="activo" type="checkbox" checked> Servicio activo</label><button id="save">Guardar servicio</button><button type="button" id="cancel" class="secondary" hidden>Cancelar edición</button></form></section><section><h2>Configuración de agenda</h2><form id="agendaForm"><div id="diasAgenda"></div><label>Intervalo (minutos)</label><select id="intervalo"><option>15</option><option>30</option><option>60</option></select><label>Anticipación máxima (días)</label><input id="anticipacion" type="number" min="1" max="365" value="30" required><button id="guardarAgenda" disabled>Guardar horarios</button></form><p id="agendaEstado" role="status"></p></section><section><h2>Bloqueos especiales</h2><form id="bloqueoForm"><label>Fecha</label><input id="fechaBloqueo" type="date" required><label><input type="checkbox" id="todoDia" checked> Todo el día</label><div id="horasBloqueo" hidden><label>Desde</label><input type="time" id="inicioBloqueo" value="09:00"><label>Hasta</label><input type="time" id="finBloqueo" value="20:00"></div><label>Motivo (privado, opcional)</label><input id="motivoBloqueo" maxlength="150"><button>Agregar bloqueo</button></form><div id="listaBloqueos"></div></section><section><h2>Agenda de turnos</h2><label>Fecha de consulta</label><input id="turnoFecha" type="date"><div id="turnosLista"></div><h3 id="turnoTitulo">Agendar turno manualmente</h3><form id="turnoForm"><label>Servicio</label><select id="turnoServicio" required></select><label>Nombre y apellido</label><input id="turnoNombre" required maxlength="120"><label>Teléfono</label><input id="turnoTel" type="tel" required maxlength="40"><label>Fecha</label><input id="turnoDia" type="date" required><label>Hora</label><input id="turnoHora" type="time" required><label>Seña recibida ($)</label><input id="turnoPago" type="number" min="0" step="0.01" value="0" required><button id="turnoGuardar" disabled>Guardar turno</button><button type="button" id="turnoCancelarEdicion" class="secondary" hidden>Cancelar edición</button></form><p id="turnoEstado" role="status"></p></section><h2>Servicios cargados</h2><div id="list"></div></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,push,set,update,remove,onValue,runTransaction,get} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const app=initializeApp({apiKey:'AIzaSyC4mgKf-7RDG9CFL6sc9RSuqG_7ZJysKUU',authDomain:'lua-nails-lash.firebaseapp.com',projectId:'lua-nails-lash',storageBucket:'lua-nails-lash.firebasestorage.app',messagingSenderId:'760291015064',appId:'1:760291015064:web:7f88e4bed9a57977fb93ed',databaseURL:'https://lua-nails-lash-default-rtdb.firebaseio.com'});const auth=getAuth(app),db=getDatabase(app),uid='NaeRy9DhLdRRZ0ynJQmYX5nd94I2';const $=id=>document.getElementById(id);let editing=null,unsubscribe=null;const msg=t=>$('status').textContent=t;const allowed=()=>auth.currentUser?.uid===uid;let uploading=false;function preview(){const url=$('foto').value.trim();$('preview').hidden=!url.startsWith('https://');if(!$('preview').hidden)$('preview').src=url;else $('preview').removeAttribute('src')}function reset(){editing=null;$('serviceForm').reset();$('formTitle').textContent='Nuevo servicio';$('cancel').hidden=true;$('uploadStatus').textContent='';preview()}function error(e){msg('No se pudo completar la operación: '+(e.code||e.message))} $('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch(e){error(e)}};$('logout').onclick=()=>signOut(auth).catch(error);$('cancel').onclick=reset;
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}const ok=user?.uid===uid;$('login').hidden=ok;$('panel').hidden=!ok;$('list').replaceChildren();reset();if(user&&!ok){msg('Usuario no autorizado.');signOut(auth).catch(error);return}if(ok){msg('Sesión iniciada.');unsubscribe=onValue(ref(db,'servicios'),snap=>render(snap.val()||{}),error)}});
$('foto').oninput=preview;
$('upload').onclick=async()=>{if(!allowed()||uploading)return;const f=$('archivo').files[0];const status=$('uploadStatus');if(!f)return status.textContent='Seleccioná una fotografía.';if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024)return status.textContent='Usá JPG, PNG o WEBP de hasta 5 MB.';const fd=new FormData();fd.append('file',f);fd.append('upload_preset','lua_nails_fotos');uploading=true;const controls=[...$('serviceForm').elements,...[$('logout')]];const states=controls.map(c=>c.disabled);controls.forEach(c=>c.disabled=true);$('list').inert=true;status.textContent='Subiendo fotografía…';try{const r=await fetch('https://api.cloudinary.com/v1_1/qqmjx1vh/image/upload',{method:'POST',body:fd});const j=await r.json();if(!r.ok||!j.secure_url)throw new Error(j.error?.message||'Error de carga');if(!allowed())return;$('foto').value=j.secure_url;preview();status.textContent='Fotografía subida. Presioná Guardar servicio.';$('archivo').value=''}catch(e){status.textContent='No se pudo subir: '+e.message}finally{uploading=false;controls.forEach((c,i)=>c.disabled=states[i]);$('list').inert=false}};
$('serviceForm').onsubmit=async e=>{e.preventDefault();if(!allowed()||uploading)return;const foto=$('foto').value.trim();if(foto&&!foto.startsWith('https://')){msg('La fotografía debe usar un enlace HTTPS.');return}const data={categoria:$('categoria').value,nombre:$('nombre').value.trim(),precio:Number($('precio').value),duracion:Number($('duracion').value),descripcion:$('descripcion').value.trim(),foto,activo:$('activo').checked};data.tipoSena=$('tipoSena').value;data.valorSena=data.tipoSena==='ninguna'?0:Number($('valorSena').value);if(data.tipoSena!=='ninguna'&&(!(data.valorSena>0)||data.valorSena>(data.tipoSena==='fija'?data.precio:100)))return msg('Revisá el valor de la seña.');if(!data.nombre)return msg('Ingresá un nombre.');$('save').disabled=true;try{if(editing)await update(ref(db,'servicios/'+editing),data);else await set(push(ref(db,'servicios')),data);reset();msg('Servicio guardado correctamente.')}catch(e){error(e)}finally{$('save').disabled=false}};
function render(data){const list=$('list');list.replaceChildren();if(!Object.keys(data).length){list.textContent='Todavía no hay servicios cargados.';return}for(const [id,s] of Object.entries(data)){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=s.nombre;a.append(h);if(typeof s.foto==='string'&&s.foto.startsWith('https://')){const img=document.createElement('img');img.src=s.foto;img.alt=s.nombre;img.referrerPolicy='no-referrer';a.append(img)}const p=document.createElement('p');p.textContent=`${s.categoria} · ${Number(s.precio).toLocaleString('es-AR',{style:'currency',currency:'ARS'})} · ${s.duracion} min · ${s.activo?'Activo':'Inactivo'}`;a.append(p);const sen=document.createElement("p");sen.textContent=s.tipoSena==="fija"?`Seña: $${s.valorSena}`:s.tipoSena==="porcentaje"?`Seña: ${s.valorSena}%`:"Sin seña";a.append(sen);const desc=document.createElement('p');desc.textContent=s.descripcion||'';a.append(desc);const actions=document.createElement('div');actions.className='actions';function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.className='secondary';b.onclick=fn;actions.append(b)}btn('Editar',()=>{editing=id;for(const k of ['categoria','nombre','precio','duracion','descripcion','foto'])$(k).value=s[k]??'';$('activo').checked=!!s.activo;$('tipoSena').value=s.tipoSena||'ninguna';$('valorSena').value=s.valorSena||0;$('archivo').value='';$('uploadStatus').textContent='';preview();$('formTitle').textContent='Editar servicio';$('cancel').hidden=false;$('serviceForm').scrollIntoView({behavior:'smooth'})});btn(s.activo?'Desactivar':'Activar',async()=>{if(!allowed())return;try{await update(ref(db,'servicios/'+id),{activo:!s.activo})}catch(e){error(e)}});btn('Eliminar',async()=>{if(!allowed()||!confirm('¿Eliminar este servicio?'))return;try{await remove(ref(db,'servicios/'+id));if(editing===id)reset();msg('Servicio eliminado.')}catch(e){error(e)}});a.append(actions);list.append(a)}}

const nombresDias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
for(const i of [1,2,3,4,5,6,0]){const d=document.createElement('article');d.innerHTML=`<label><input type="checkbox" id="dia${i}" ${i?'checked':''}> ${nombresDias[i]}</label><div class="actions"><label>Desde<input type="time" id="desde${i}" value="09:00" required></label><label>Hasta<input type="time" id="hasta${i}" value="20:00" required></label></div><label><input type="checkbox" id="pausa${i}"> Descanso</label><div class="actions"><label>Desde<input type="time" id="pd${i}" value="13:00" required></label><label>Hasta<input type="time" id="ph${i}" value="14:00" required></label></div>`;$('diasAgenda').append(d)}
let agendaOff=[],agendaReady=false;
function agendaMensaje(t){$('agendaEstado').textContent=t}
onAuthStateChanged(auth,user=>{agendaOff.forEach(f=>f());agendaOff=[];agendaReady=false;$('guardarAgenda').disabled=true;$('listaBloqueos').replaceChildren();if(user?.uid!==uid)return;agendaOff.push(onValue(ref(db,'configuracionPublica/agenda'),snap=>{const a=snap.val()||{};for(let i=0;i<7;i++){const d=a.dias?.[i]||{};$('dia'+i).checked=d.activo??i!==0;$('desde'+i).value=d.desde||'09:00';$('hasta'+i).value=d.hasta||'20:00';$('pausa'+i).checked=!!d.pausa;$('pd'+i).value=d.pausaDesde||'13:00';$('ph'+i).value=d.pausaHasta||'14:00'}$('intervalo').value=a.intervalo||15;$('anticipacion').value=a.anticipacion||30;agendaReady=true;$('guardarAgenda').disabled=false;agendaMensaje(snap.exists()?'Configuración guardada.':'Valores iniciales: presioná Guardar horarios.')},error));agendaOff.push(onValue(ref(db,'bloqueos'),snap=>{const list=$('listaBloqueos');list.replaceChildren();for(const [id,b] of Object.entries(snap.val()||{}).sort((a,b)=>a[1].fecha.localeCompare(b[1].fecha))){const p=document.createElement('article');const t=document.createElement('p');t.textContent=`${b.fecha} · ${b.todoDia?'Todo el día':b.desde+' a '+b.hasta} · ${b.motivo||''}`;p.append(t);const btn=document.createElement('button');btn.textContent='Quitar bloqueo';btn.className='secondary';btn.onclick=async()=>{if(allowed()&&confirm('¿Quitar bloqueo?'))try{await remove(ref(db,'bloqueos/'+id))}catch(e){error(e)}};p.append(btn);list.append(p)}},error))});
$('agendaForm').onsubmit=async e=>{e.preventDefault();if(!allowed()||!agendaReady)return;const dias={};for(let i=0;i<7;i++){const d={activo:$('dia'+i).checked,desde:$('desde'+i).value,hasta:$('hasta'+i).value,pausa:$('pausa'+i).checked,pausaDesde:$('pd'+i).value,pausaHasta:$('ph'+i).value};if(d.activo&&(d.desde>=d.hasta||(d.pausa&&(d.pausaDesde<d.desde||d.pausaHasta>d.hasta||d.pausaDesde>=d.pausaHasta))))return agendaMensaje('Revisá los horarios de '+nombresDias[i]);dias[i]=d}try{await set(ref(db,'configuracionPublica/agenda'),{dias,intervalo:Number($('intervalo').value),anticipacion:Number($('anticipacion').value),confirmacion:'manual',retencion:'hasta_resolucion'});agendaMensaje('Horarios guardados correctamente.')}catch(e){error(e)}};
$('todoDia').onchange=()=>{$('horasBloqueo').hidden=$('todoDia').checked};
$('bloqueoForm').onsubmit=async e=>{e.preventDefault();if(!allowed())return;const todoDia=$('todoDia').checked,desde=todoDia?'00:00':$('inicioBloqueo').value,hasta=todoDia?'24:00':$('finBloqueo').value;if(!desde||!hasta||desde>=hasta)return msg('Revisá las horas del bloqueo.');try{await set(push(ref(db,'bloqueos')),{fecha:$('fechaBloqueo').value,todoDia,desde,hasta,motivo:$('motivoBloqueo').value.trim()});$('bloqueoForm').reset();$('horasBloqueo').hidden=true;msg('Bloqueo guardado.')}catch(e){error(e)}};

const hoyAR=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
$('turnoFecha').value=$('turnoDia').value=hoyAR();
let turnoOff=[],turnos={},serviciosTurno={},editTurno=null,turnosReady=false;
const tm=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const plata=n=>Number(n).toLocaleString('es-AR',{style:'currency',currency:'ARS'});
const estadoTurno=t=>$('turnoEstado').textContent=t;
const ocupa=t=>['pendiente','confirmado'].includes(t.estado);
function resetTurno(){editTurno=null;$('turnoForm').reset();$('turnoDia').value=$('turnoFecha').value||hoyAR();$('turnoTitulo').textContent='Agendar turno manualmente';$('turnoCancelarEdicion').hidden=true;opcionesTurno()}
function opcionesTurno(){const sel=$('turnoServicio'),prev=sel.value;sel.replaceChildren();for(const [id,s] of Object.entries(serviciosTurno)){if(!s.activo&&id!==turnos[editTurno]?.servicioId)continue;const o=new Option(s.nombre+' · '+s.duracion+' min',id);sel.add(o)}if([...sel.options].some(o=>o.value===prev))sel.value=prev;}
function dibujarTurnos(){const list=$('turnosLista');list.replaceChildren();const entries=Object.entries(turnos).filter(([id,t])=>t.fecha===$('turnoFecha').value).sort((a,b)=>a[1].inicio-b[1].inicio);if(!entries.length)list.textContent='No hay turnos para esta fecha.';for(const [id,t] of entries){const a=document.createElement('article');for(const txt of [t.hora+' · '+t.estado.toUpperCase(),t.nombre+' · '+t.servicio,t.telefono,'Total: '+plata(t.precio)+' · Seña prevista: '+plata(t.sena)+' · Recibida: '+plata(t.pagado)+' · Saldo: '+plata(t.precio-t.pagado)]){const el=document.createElement('p');el.textContent=txt;a.append(el)}const actions=document.createElement('div');actions.className='actions';const btn=(label,fn)=>{const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=fn;actions.append(b)};if(t.estado==='pendiente'){btn('Confirmar',()=>cambiarEstado(id,'confirmado'));btn('Rechazar',()=>cambiarEstado(id,'rechazado'))}if(ocupa(t)){btn('Cancelar turno',()=>cambiarEstado(id,'cancelado'));btn('Editar / reprogramar',()=>{editTurno=id;opcionesTurno();$('turnoServicio').value=t.servicioId;$('turnoNombre').value=t.nombre;$('turnoTel').value=t.telefono;$('turnoDia').value=t.fecha;$('turnoHora').value=t.hora;$('turnoPago').value=t.pagado;$('turnoTitulo').textContent='Editar turno';$('turnoCancelarEdicion').hidden=false;$('turnoForm').scrollIntoView({behavior:'smooth'})})}a.append(actions);list.append(a)}}
async function cambiarEstado(id,estado){if(!allowed()||!confirm('¿Cambiar estado a '+estado+'?'))return;try{const r=await runTransaction(ref(db,'turnos'),data=>{if(!data?.[id]||!ocupa(data[id]))return;data[id].estado=estado;return data});estadoTurno(r.committed?'Estado actualizado.':'El turno ya cambió.')}catch(e){error(e)}}
$('turnoFecha').onchange=()=>{dibujarTurnos();if(!editTurno)$('turnoDia').value=$('turnoFecha').value};$('turnoCancelarEdicion').onclick=resetTurno;
onAuthStateChanged(auth,user=>{turnoOff.forEach(f=>f());turnoOff=[];turnos={};serviciosTurno={};turnosReady=false;$('turnoGuardar').disabled=true;resetTurno();dibujarTurnos();if(user?.uid!==uid)return;turnoOff.push(onValue(ref(db,'servicios'),s=>{serviciosTurno=s.val()||{};opcionesTurno()},error));turnoOff.push(onValue(ref(db,'turnos'),s=>{turnos=s.val()||{};turnosReady=true;$('turnoGuardar').disabled=false;dibujarTurnos()},error))});
$('turnoForm').onsubmit=async e=>{e.preventDefault();if(!allowed()||!turnosReady)return;const sid=$('turnoServicio').value,s=serviciosTurno[sid],old=turnos[editTurno],fecha=$('turnoDia').value,hora=$('turnoHora').value,nombre=$('turnoNombre').value.trim(),telefono=$('turnoTel').value.trim(),pagado=Number($('turnoPago').value);if(!s||!nombre||!telefono||!hora)return estadoTurno('Completá todos los datos.');const mismo=old?.servicioId===sid,precio=Number(mismo?old.precio:s.precio),duracion=Number(mismo?old.duracion:s.duracion),inicio=tm(hora),fin=inicio+duracion,sena=mismo?old.sena:Math.round((s.tipoSena==='fija'?Number(s.valorSena):s.tipoSena==='porcentaje'?precio*Number(s.valorSena)/100:0)*100)/100;if(!Number.isFinite(fin)||duracion<=0||fin>1440||pagado<0||pagado>precio)return estadoTurno('Revisá duración y pago.');const id=editTurno||push(ref(db,'turnos')).key;const data={servicioId:sid,servicio:mismo?old.servicio:s.nombre,nombre,telefono,fecha,hora,inicio,fin,duracion,precio,sena,pagado,estado:old?.estado||'confirmado'};$('turnoGuardar').disabled=true;try{const [ag,bl]=await Promise.all([get(ref(db,'configuracionPublica/agenda')),get(ref(db,'bloqueos'))]);const a=ag.val()||{},dia=new Date(fecha+'T12:00:00').getDay(),d=a.dias?.[dia]||{activo:dia!==0,desde:'09:00',hasta:'20:00'};const sinCambio=old&&old.fecha===fecha&&old.inicio===inicio&&old.fin===fin;if(!sinCambio){if(fecha<hoyAR()||!d.activo||inicio<tm(d.desde)||fin>tm(d.hasta)||inicio%(a.intervalo||15)!==0||(d.pausa&&inicio<tm(d.pausaHasta)&&fin>tm(d.pausaDesde)))return estadoTurno('Horario fuera de atención o descanso.');if(Object.values(bl.val()||{}).some(b=>b.fecha===fecha&&(b.todoDia||inicio<tm(b.hasta)&&fin>tm(b.desde))))return estadoTurno('Horario bloqueado.')}let motivo='Horario ocupado.';const r=await runTransaction(ref(db,'turnos'),all=>{all=all||{};if(old&&(!all[id]||!ocupa(all[id])||JSON.stringify(all[id])!==JSON.stringify(old))){motivo='El turno cambió; volvé a editarlo.';return}if(Object.entries(all).some(([k,t])=>k!==id&&ocupa(t)&&t.fecha===fecha&&inicio<t.fin&&fin>t.inicio))return;all[id]=data;return all});if(!r.committed)return estadoTurno(motivo);$('turnoFecha').value=fecha;resetTurno();dibujarTurnos();estadoTurno('Turno guardado correctamente.')}catch(e){error(e)}finally{$('turnoGuardar').disabled=!turnosReady}};
</script></body></html>
